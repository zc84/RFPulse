<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 584 1416"><title id="title">Content Authoring, Publishing, and AI Assist Workflow</title><desc id="desc">Workflow for authoring, AI-assisted enrichment, approval, publishing, and public delivery of bilingual Arabic/English content through Drupal CMS and the Next.js website.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="36" y="36" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Content Authoring, Publishing, and AI Assist Workflow</text><g font-family="Inter,Arial,sans-serif"><g><rect x="48.33333333333334" y="36" width="505.66666666666663" height="662" rx="16" fill="#F8FAFC" fill-opacity=".75" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="62.33333333333334" y="57" font-size="12" font-weight="700" fill="#475569">Authoring &amp; Approval</text></g><g><rect x="30" y="552" width="260" height="318" rx="16" fill="#F8FAFC" fill-opacity=".75" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="44" y="573" font-size="12" font-weight="700" fill="#475569">AI Assist</text></g><g><rect x="294" y="724" width="260" height="662" rx="16" fill="#F8FAFC" fill-opacity=".75" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="308" y="745" font-size="12" font-weight="700" fill="#475569">Publishing &amp; Delivery</text></g><g><path d="M 178.33333333333334 162 L 178.33333333333334 242" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="178.33333333333334" y="234" text-anchor="middle" font-size="12" fill="#475569">Sign in</text></g><g><path d="M 178.33333333333334 334 L 178.33333333333334 414" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="178.33333333333334" y="406" text-anchor="middle" font-size="12" fill="#475569">Create or edit Arabic/English content</text></g><g><path d="M 123.33333333333334 506 L 123.33333333333334 586" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="123.33333333333334" y="578" text-anchor="middle" font-size="12" fill="#475569">Request suggestions, summaries, SEO, tags</text></g><g><path d="M 123.33333333333334 678 L 123.33333333333334 758" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="123.33333333333334" y="750" text-anchor="middle" font-size="12" fill="#475569">Controlled prompt call</text></g><g><path d="M 196.66666666666669 758 L 196.66666666666669 678" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="196.66666666666669" y="670" text-anchor="middle" font-size="12" fill="#475569">Return AI recommendations</text></g><g><path d="M 196.66666666666669 586 L 196.66666666666669 516 L 178.33333333333334 516 L 178.33333333333334 506" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="178.33333333333334" y="508" text-anchor="middle" font-size="12" fill="#475569">Apply governed recommendations</text></g><g><path d="M 233.33333333333334 506 L 233.33333333333334 516 L 424 516 L 424 586" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="424" y="508" text-anchor="middle" font-size="12" fill="#475569">Submit for review</text></g><g><path d="M 424 678 L 424 758" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="424" y="750" text-anchor="middle" font-size="12" fill="#475569">Approve or request changes</text></g><g><path d="M 424 850 L 424 930" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="424" y="922" text-anchor="middle" font-size="12" fill="#475569">Persist, index, refresh cache</text></g><g><path d="M 424 1022 L 424 1102" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="424" y="1094" text-anchor="middle" font-size="12" fill="#475569">Expose approved content</text></g><g><path d="M 424 1194 L 424 1274" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="424" y="1266" text-anchor="middle" font-size="12" fill="#475569">View published pages</text></g><g id="wf-author" transform="translate(68.33333333333334,70)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><circle cx="28" cy="23" r="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 35c1-6 15-6 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Content Author</text><text x="52" y="45" font-size="12" fill="#4F46E5">CMS user</text><text x="16" y="70" font-size="11" fill="#475569">Draft and update bilingual website content.</text></g><g id="wf-sso" transform="translate(68.33333333333334,242)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FCE7F3" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">UAEPass / SSO</text><text x="52" y="45" font-size="12" fill="#4F46E5">UAEPass / SSO</text><text x="16" y="70" font-size="11" fill="#475569">Authenticate the author before CMS access.</text></g><g id="wf-draft" transform="translate(68.33333333333334,414)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Draft Content</text><text x="52" y="45" font-size="12" fill="#4F46E5">Drupal CMS</text><text x="16" y="70" font-size="11" fill="#475569">Create, translate, edit, tag, and prepare content in Drupal workflow.</text></g><g id="wf-ai-gateway" transform="translate(50,586)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">AI Gateway</text><text x="52" y="45" font-size="12" fill="#4F46E5">AI gateway</text><text x="16" y="70" font-size="11" fill="#475569">Apply governance and prompt controls for AI-assisted authoring.</text></g><g id="wf-ai-provider" transform="translate(50,758)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">AI Provider</text><text x="52" y="45" font-size="12" fill="#4F46E5">Authority-approved AI</text><text x="16" y="70" font-size="11" fill="#475569">Generate suggestions, summaries, SEO metadata, keywords, and categorization support.</text></g><g id="wf-approver" transform="translate(314,586)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Approver</text><text x="52" y="45" font-size="12" fill="#4F46E5">CMS workflow role</text><text x="16" y="70" font-size="11" fill="#475569">Review content for quality, compliance, accessibility, and publishing readiness.</text></g><g id="wf-publish" transform="translate(314,758)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Publish / Schedule</text><text x="52" y="45" font-size="12" fill="#4F46E5">Drupal publishing workflow</text><text x="16" y="70" font-size="11" fill="#475569">Publish immediately or schedule approved content release.</text></g><g id="wf-content-services" transform="translate(314,930)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#DCFCE7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><ellipse cx="28" cy="23" rx="8" ry="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 23v10c0 5 16 5 16 0V23M20 28c0 5 16 5 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Content Services</text><text x="52" y="45" font-size="12" fill="#4F46E5">PostgreSQL / OpenSearch / Redis / Varnish</text><text x="16" y="70" font-size="11" fill="#475569">Store, index, and cache approved content for delivery.</text></g><g id="wf-public-site" transform="translate(314,1102)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Public Site</text><text x="52" y="45" font-size="12" fill="#4F46E5">Next.js</text><text x="16" y="70" font-size="11" fill="#475569">Serve DLS 3.0-aligned, WCAG 2.2 AA pages through the frontend.</text></g><g id="wf-visitor" transform="translate(314,1274)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><circle cx="28" cy="23" r="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 35c1-6 15-6 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Visitor</text><text x="52" y="45" font-size="12" fill="#4F46E5">Browser</text><text x="16" y="70" font-size="11" fill="#475569">Consume published Arabic/English website content and services.</text></g></g><text x="560" y="1398" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94A3B8">Solid: synchronous/data · Dashed: asynchronous/event</text></svg>