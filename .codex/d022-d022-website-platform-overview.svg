hor="middle" font-size="12" fill="#475569">Notifications and integrations</text></g><g><path d="M 570 534 L 590 534 L 590 395.6666666666667 L 650 395.6666666666667" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="590" y="387.6666666666667" text-anchor="middle" font-size="12" fill="#475569">Build, release, rollback</text></g><g><path d="M 570 564.6666666666667 L 1190 564.6666666666667 L 1190 438.8666666666667 L 1250 438.8666666666667" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1190" y="430.8666666666667" text-anchor="middle" font-size="12" fill="#475569">Deploy CMS changes</text></g><g><path d="M 270 442.73333333333335 L 280 442.73333333333335 L 280 365 L 350 365" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="280" y="357" text-anchor="middle" font-size="12" fill="#475569">Monitor WAF/CDN/TLS</text></g><g><path d="M 270 461.1333333333334 L 580 461.1333333333334 L 580 372.6666666666667 L 650 372.6666666666667" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="580" y="364.6666666666667" text-anchor="middle" font-size="12" fill="#475569">Monitor UX and performance</text></g><g><path d="M 270 479.53333333333336 L 290 479.53333333333336 L 290 605.3333333333334 L 1200 605.3333333333334 L 1200 457.26666666666665 L 1250 457.26666666666665" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1200" y="597.3333333333334" text-anchor="middle" font-size="12" fill="#475569">Monitor CMS workflows</text></g><g><path d="M 270 497.9333333333334 L 280 497.9333333333334 L 280 675.3333333333334 L 1550 675.3333333333334" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="280" y="667.3333333333334" text-anchor="middle" font-size="12" fill="#475569">Monitor database health</text></g><g id="visitor" transform="translate(50,288.33333333333337)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><circle cx="28" cy="23" r="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 35c1-6 15-6 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Public Visitor</text><text x="52" y="45" font-size="12" fill="#4F46E5">Browser</text><text x="16" y="70" font-size="11" fill="#475569">Access bilingual Arabic/English public website content and services.</text></g><g id="edge" transform="translate(350,303.6666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FCE7F3" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M28 19l8 3v6c0 6-4 9-8 11-4-2-8-5-8-11v-6z" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Edge Security</text><text x="52" y="45" font-size="12" fill="#4F46E5">WAF / CDN / TLS</text><text x="16" y="70" font-size="11" fill="#475569">Protect and terminate public traffic with WAF, CDN, and TLS controls.</text></g><g id="frontend" transform="translate(650,326.6666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Next.js Frontend</text><text x="52" y="45" font-size="12" fill="#4F46E5">Next.js</text><text x="16" y="70" font-size="11" fill="#475569">Render responsive DLS 3.0-aligned, WCAG 2.2 AA public web experience.</text></g><g id="cms" transform="translate(1250,383.6666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Drupal CMS</text><text x="52" y="45" font-size="12" fill="#4F46E5">Drupal</text><text x="16" y="70" font-size="11" fill="#475569">Manage multilingual content, media, workflow, approvals, scheduling, and publishing.</text></g><g id="authors" transform="translate(650,462.6666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><circle cx="28" cy="23" r="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 35c1-6 15-6 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Content Authors</text><text x="52" y="45" font-size="12" fill="#4F46E5">CMS roles</text><text x="16" y="70" font-size="11" fill="#475569">Create, review, approve, and publish bilingual website content.</text></g><g id="db" transform="translate(1550,614)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#DCFCE7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><ellipse cx="28" cy="23" rx="8" ry="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 23v10c0 5 16 5 16 0V23M20 28c0 5 16 5 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">PostgreSQL</text><text x="52" y="45" font-size="12" fill="#4F46E5">PostgreSQL</text><text x="16" y="70" font-size="11" fill="#475569">Store content, metadata, configuration, workflow state, and audit records.</text></g><g id="search" transform="translate(1550,342)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#DCFCE7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">OpenSearch</text><text x="52" y="45" font-size="12" fill="#4F46E5">OpenSearch</text><text x="16" y="70" font-size="11" fill="#475569">Provide advanced site search across bilingual content and metadata.</text></g><g id="cache" transform="translate(1550,70)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#DCFCE7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Redis / Varnish</text><text x="52" y="45" font-size="12" fill="#4F46E5">Redis / Varnish</text><text x="16" y="70" font-size="11" fill="#475569">Improve performance through application, page, and content caching.</text></g><g id="ai-gateway" transform="translate(1550,478)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">AI Gateway</text><text x="52" y="45" font-size="12" fill="#4F46E5">AI gateway</text><text x="16" y="70" font-size="11" fill="#475569">Govern prompts, AI usage, controls, logging, and policy enforcement for CMS AI assist.</text></g><g id="cicd" transform="translate(350,503.33333333333337)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#EDE9FE" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">CI/CD Deployment</text><text x="52" y="45" font-size="12" fill="#4F46E5">CI/CD pipelines</text><text x="16" y="70" font-size="11" fill="#475569">Build, release, deploy, and rollback frontend and CMS changes.</text></g><g id="ops" transform="translate(50,424.33333333333337)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#EDE9FE" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Ops &amp; Support</text><text x="52" y="45" font-size="12" fill="#4F46E5">Monitoring / logging</text><text x="16" y="70" font-size="11" fill="#475569">Provide monitoring, logs, hypercare, and post-launch support.</text></g><g id="sso" transform="translate(950,447.33333333333337)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FCE7F3" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">UAEPass / SSO</text><text x="52" y="45" font-size="12" fill="#4F46E5">UAEPass / SSO</text><text x="16" y="70" font-size="11" fill="#475569">Authenticate public users and CMS authors where required.</text></g><g id="ai-provider" transform="translate(1850,478)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Approved AI Provider</text><text x="52" y="45" font-size="12" fill="#4F46E5">Authority-approved AI</text><text x="16" y="70" font-size="11" fill="#475569">Provide AI capabilities for suggestions, summaries, SEO metadata, tagging, and language supp</text></g><g id="services" transform="translate(1550,206)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">External Services</text><text x="52" y="45" font-size="12" fill="#4F46E5">Email / SMS / Analytics / Social / Chatbot</text><text x="16" y="70" font-size="11" fill="#475569">Support email, SMS, analytics, social integration, and chatbot embedding or APIs.</text></g></g><text x="2096" y="738" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94A3B8">Solid: synchronous/data · Dashed: asynchronous/event</text></svg>