<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1820 348"><title id="title">Content Workflow</title><desc id="desc">Authoring, AI assist, approval, and publishing flow for D-022.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".12"/></filter></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="36" y="36" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0F172A">Content Workflow</text><g font-family="Inter,Arial,sans-serif"><g><rect x="30" y="43.66666666666667" width="860" height="146" rx="16" fill="#F8FAFC" fill-opacity=".75" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="44" y="64.66666666666667" font-size="12" font-weight="700" fill="#475569">Authoring</text></g><g><rect x="930" y="36" width="560" height="146" rx="16" fill="#F8FAFC" fill-opacity=".75" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="944" y="57" font-size="12" font-weight="700" fill="#475569">AI Assist</text></g><g><rect x="930" y="172" width="860" height="146" rx="16" fill="#F8FAFC" fill-opacity=".75" stroke="#CBD5E1" stroke-dasharray="5 4"/><text x="944" y="193" font-size="12" font-weight="700" fill="#475569">Publishing</text></g><g><path d="M 270 123.66666666666667 L 350 123.66666666666667" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="115.66666666666667" text-anchor="middle" font-size="12" fill="#475569">sign in</text></g><g><path d="M 570 123.66666666666667 L 650 123.66666666666667" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="115.66666666666667" text-anchor="middle" font-size="12" fill="#475569">open CMS</text></g><g><path d="M 870 100.66666666666667 L 950 100.66666666666667" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="950" y="92.66666666666667" text-anchor="middle" font-size="12" fill="#475569">request suggestions</text></g><g><path d="M 1170 100.66666666666667 L 1250 100.66666666666667" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1250" y="92.66666666666667" text-anchor="middle" font-size="12" fill="#475569">controlled prompt call</text></g><g><path d="M 1250 131.33333333333334 L 1170 131.33333333333334" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1170" y="123.33333333333334" text-anchor="middle" font-size="12" fill="#475569">suggestions</text></g><g><path d="M 950 131.33333333333334 L 880 131.33333333333334 L 880 123.66666666666667 L 870 123.66666666666667" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="880" y="115.66666666666667" text-anchor="middle" font-size="12" fill="#475569">return suggestions</text></g><g><path d="M 870 146.66666666666669 L 880 146.66666666666669 L 880 252 L 950 252" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="880" y="244" text-anchor="middle" font-size="12" fill="#475569">submit for review</text></g><g><path d="M 1170 252 L 1250 252" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1250" y="244" text-anchor="middle" font-size="12" fill="#475569">approve or request changes</text></g><g><path d="M 1470 252 L 1550 252" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1550" y="244" text-anchor="middle" font-size="12" fill="#475569">expose approved content</text></g><g id="author" transform="translate(50,77.66666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><circle cx="28" cy="23" r="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 35c1-6 15-6 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Content Author</text><text x="52" y="45" font-size="12" fill="#4F46E5">CMS user</text><text x="16" y="70" font-size="11" fill="#475569">Draft and update bilingual website content.</text></g><g id="sso" transform="translate(350,77.66666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FCE7F3" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M28 19l8 3v6c0 6-4 9-8 11-4-2-8-5-8-11v-6z" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">UAEPass / SSO</text><text x="52" y="45" font-size="12" fill="#4F46E5">UAEPass / SSO</text><text x="16" y="70" font-size="11" fill="#475569">Authenticate the author before CMS access.</text></g><g id="draft" transform="translate(650,77.66666666666667)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Draft Content</text><text x="52" y="45" font-size="12" fill="#4F46E5">Drupal CMS</text><text x="16" y="70" font-size="11" fill="#475569">Create, translate, edit, tag, and prepare content.</text></g><g id="ai-gateway" transform="translate(950,70)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">AI Gateway</text><text x="52" y="45" font-size="12" fill="#4F46E5">AI gateway</text><text x="16" y="70" font-size="11" fill="#475569">Apply governance and prompt controls for AI-assisted edits.</text></g><g id="ai-provider" transform="translate(1250,70)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#FEF3C7" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M20 33h16a5 5 0 0 0 0-10 8 8 0 0 0-15-1 6 6 0 0 0-1 11z" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">AI Provider</text><text x="52" y="45" font-size="12" fill="#4F46E5">Authority-approved AI</text><text x="16" y="70" font-size="11" fill="#475569">Generate suggestions, summaries, SEO metadata, and tags.</text></g><g id="review" transform="translate(950,206)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#E0E7FF" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><circle cx="28" cy="23" r="4" fill="none" stroke="white" stroke-width="1.8"/><path d="M20 35c1-6 15-6 16 0" fill="none" stroke="white" stroke-width="1.8"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Approver</text><text x="52" y="45" font-size="12" fill="#4F46E5">CMS workflow role</text><text x="16" y="70" font-size="11" fill="#475569">Review content for quality, compliance, and accessibility.</text></g><g id="publish" transform="translate(1250,206)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#F8FAFC" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Publish / Schedule</text><text x="52" y="45" font-size="12" fill="#4F46E5">Drupal publishing workflow</text><text x="16" y="70" font-size="11" fill="#475569">Publish immediately or schedule approved content.</text></g><g id="site" transform="translate(1550,206)" filter="url(#shadow)"><rect width="220" height="92" rx="12" fill="#DBEAFE" stroke="#94A3B8"/><circle cx="28" cy="28" r="14" fill="#4F46E5"/><path d="M21 21h14v14H21zM24 25h8M24 29h8M24 33h5" fill="none" stroke="white" stroke-width="1.6"/><text x="52" y="25" font-size="15" font-weight="700" fill="#0F172A">Public Site</text><text x="52" y="45" font-size="12" fill="#4F46E5">Next.js</text><text x="16" y="70" font-size="11" fill="#475569">Serve published Arabic/English pages to visitors.</text></g></g><text x="1796" y="330" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94A3B8">Solid: synchronous/data · Dashed: asynchronous/event</text></svg>