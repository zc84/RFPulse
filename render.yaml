services:
  - type: web
    name: rfpulse
    runtime: node
    plan: starter
    buildCommand: npm run render:build
    preDeployCommand: npm run render:predeploy
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rfpulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ENDPOINT_VISUALS_ENABLED
        value: "true"
      - key: ENDPOINT_VISUAL_TIMEOUT_MS
        value: "300000"
      - key: ENDPOINT_VISUAL_MAX_CONCURRENT
        value: "2"
      - key: ENDPOINT_VISUAL_DEPLOYMENT_MODE
        value: single-instance
      - key: ENDPOINT_VISUAL_PROVIDER_MAX_CONCURRENT
        value: "2"
      - key: ENDPOINT_VISUAL_ARCHITECTURE_RENDERER
        value: shared
      - key: ENDPOINT_VISUAL_MAX_ARTIFACT_BYTES
        value: "3145728"
      - key: ENDPOINT_VISUAL_MAX_OUTPUT_BYTES
        value: "6291456"
    disk:
      name: rfpulse-uploads
      mountPath: /var/data
      sizeGB: 5

databases:
  - name: rfpulse-db
    plan: free
    databaseName: rfpulse
    user: rfpulse
